<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stress Detection</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- PDF LIBS -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<style>
body {
    background: linear-gradient(to right, #e3f2fd, #bbdefb);
    min-height: 100vh;
    padding: 20px;
    transition: background 0.6s ease, color 0.6s ease;
}

body.dark {
    background: linear-gradient(to right, #121212, #1e1e1e);
    color: #f1f1f1;
}

.card {
    border-radius: 18px;
    box-shadow: 0 8px 22px rgba(0,0,0,0.12);
    margin-bottom: 20px;
}

body.dark .card {
    background: #1f1f1f;
    color: #f1f1f1;
}

h2 {
    text-align: center;
    font-weight: bold;
    margin-bottom: 20px;
}

#avatar { font-size: 60px; text-align: center; }

#gaugeWrapper { position: relative; }
#gaugeText {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 26px;
    font-weight: bold;
}

.pulse {
    animation: pulse 1.4s infinite;
}
@keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(244,67,54,0.6); }
    70% { box-shadow: 0 0 0 15px rgba(244,67,54,0); }
    100% { box-shadow: 0 0 0 0 rgba(244,67,54,0); }
}

.prob-bar { height: 22px; }
</style>
</head>

<body>

<h2>Stress Detection</h2>

<div class="text-end mb-2">
<button class="btn btn-sm btn-outline-secondary" onclick="toggleDark()">🌙 Dark Mode</button>
</div>

<ul class="nav nav-tabs justify-content-center mb-3">
  <li class="nav-item">
    <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#predictTab">Stress Prediction</button>
  </li>
  <li class="nav-item">
    <button class="nav-link" data-bs-toggle="tab" data-bs-target="#dashboardTab">Model Dashboard</button>
  </li>
</ul>

<div class="tab-content">

<!-- ================= PREDICTION TAB ================= -->
<div class="tab-pane fade show active" id="predictTab">
<div class="container">
<div class="row">

<!-- INPUT -->
<div class="col-md-6">
<div class="card p-3">
<h6 class="text-center text-primary">📱 Smartphone Usage</h6>
<div id="avatar">🙂</div>
<form id="stressForm"></form>

<div class="d-grid gap-2 mt-3">
<button class="btn btn-primary" onclick="predict()">Predict Stress</button>
<button class="btn btn-outline-danger" onclick="resetForm()">Reset</button>
<button class="btn btn-outline-primary" onclick="downloadPDF()">📄 Download PDF Report</button>
</div>
</div>
</div>

<!-- RESULT -->
<div class="col-md-6">
<div class="card p-3" id="resultCard">
<h6 class="text-center text-success">🧠 Stress Result</h6>

<div id="gaugeWrapper">
<canvas id="gauge" height="220"></canvas>
<div id="gaugeText">0%</div>
</div>

<div id="explain" class="fw-bold text-center mt-2"></div>

<div id="probabilitySection" class="mt-3 d-none">
<h6 class="text-center">Prediction Confidence</h6>

<div>Low</div>
<div class="progress mb-2">
  <div id="probLow" class="progress-bar bg-success prob-bar"></div>
</div>

<div>Medium</div>
<div class="progress mb-2">
  <div id="probMedium" class="progress-bar bg-warning prob-bar"></div>
</div>

<div>High</div>
<div class="progress mb-2">
  <div id="probHigh" class="progress-bar bg-danger prob-bar"></div>
</div>
</div>

</div>
</div>

</div>
</div>
</div>

<!-- ================= DASHBOARD TAB ================= -->
<div class="tab-pane fade" id="dashboardTab">
<div class="container mt-3">

<div class="row text-center">
  <div class="col-md-4"><div class="card p-3"><h6>Accuracy</h6><h4>{{ accuracy }}%</h4></div></div>
  <div class="col-md-4"><div class="card p-3"><h6>RMSE</h6><h4>{{ rmse }}</h4></div></div>
  <div class="col-md-4"><div class="card p-3"><h6>MAE</h6><h4>{{ mae }}</h4></div></div>
</div>

<hr>

<h6 class="text-center">Confusion Matrix</h6>
<img src="/static/confusion_matrix.png" class="img-fluid d-block mx-auto" width="400">

<hr>

<h6 class="text-center">Feature Importance</h6>
<img src="/static/feature_importance.png" class="img-fluid d-block mx-auto" width="600">

</div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<script>
const fields=[
"Daily_Screen_Time_Hours","Phone_Unlocks_Per_Day","Social_Media_Usage_Hours",
"Gaming_Usage_Hours","Streaming_Usage_Hours","Messaging_Usage_Hours",
"Work_Related_Usage_Hours","Sleep_Hours","Physical_Activity_Hours",
"Time_Spent_With_Family_Hours","Online_Shopping_Hours","Push_Notifications_Per_Day"
];

stressForm.innerHTML = fields.map(f=>`
<label>${f.replaceAll("_"," ")}</label>
<input type="number" step="0.1" class="form-control mb-2" id="${f}">
`).join("");

let lastResult=null;

let gauge=new Chart(document.getElementById("gauge"),{
type:"doughnut",
data:{datasets:[{data:[0,100],backgroundColor:["#2196f3","#eee"],borderWidth:0}]},
options:{cutout:"70%",animation:{duration:1200}}
});

function predict(){
 let data={}; fields.forEach(f=>data[f]=+document.getElementById(f).value||0);

 fetch("/predict",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)})
 .then(r=>r.json())
 .then(res=>{
   lastResult={data,res};

   document.getElementById("probabilitySection").classList.remove("d-none");

   probLow.style.width=res.probabilities.Low+"%";
   probLow.innerText=res.probabilities.Low+"%";
   probMedium.style.width=res.probabilities.Medium+"%";
   probMedium.innerText=res.probabilities.Medium+"%";
   probHigh.style.width=res.probabilities.High+"%";
   probHigh.innerText=res.probabilities.High+"%";

   let color,value,emoji;

   // === ADD BACKGROUND COLOR LOGIC HERE ===
   if(res.stress_level==="Low"){
     color="#4caf50"; value=30; emoji="😄";
     document.body.style.background="linear-gradient(to right,#e8f5e9,#c8e6c9)";
     resultCard.classList.remove("pulse");
   } else if(res.stress_level==="Medium"){
     color="#ffca28"; value=60; emoji="😐";
     document.body.style.background="linear-gradient(to right,#fff8e1,#ffecb3)";
     resultCard.classList.remove("pulse");
   } else {
     color="#f44336"; value=90; emoji="😫";
     document.body.style.background="linear-gradient(to right,#ffebee,#ffcdd2)";
     resultCard.classList.add("pulse");
   }

   avatar.innerText=emoji;
   explain.innerText="Predicted Stress Level: "+res.stress_level;

   gauge.data.datasets[0].backgroundColor=[color,"#eee"];
   gauge.data.datasets[0].data=[value,100-value];
   gauge.update();

   animatePercent(value);
 });
}

function animatePercent(target){
 let i=0;
 let interval=setInterval(()=>{
   gaugeText.innerText=i+"%";
   if(i>=target) clearInterval(interval);
   i++;
 },15);
}

// ================= PDF OPTION =================
async function downloadPDF(){
 if(!lastResult){ alert("Predict stress first"); return; }

 const { jsPDF } = window.jspdf;
 const pdf=new jsPDF();

 pdf.text("Stress Detection Report",20,20);
 pdf.text("Date: "+new Date().toLocaleString(),20,30);
 pdf.text("Result: "+lastResult.res.stress_level,20,40);

 let y=50;
 fields.forEach(f=>{
   pdf.text(f.replaceAll("_"," ")+": "+lastResult.data[f],20,y);
   y+=7;
 });

 pdf.text("Recommendations:",20,y+5);
 pdf.text(explain.innerText,20,y+15);

 const img=gauge.toBase64Image();
 pdf.addImage(img,"PNG",120,30,60,60);

 pdf.save("Stress_Report.pdf");
}

function resetForm(){
 document.querySelectorAll("input").forEach(i=>i.value="");
 avatar.innerText="🙂";
 explain.innerText="";
 gaugeText.innerText="0%";
 gauge.data.datasets[0].data=[0,100];
 gauge.data.datasets[0].backgroundColor=["#2196f3","#eee"];
 gauge.update();
 document.getElementById("probabilitySection").classList.add("d-none");
 resultCard.classList.remove("pulse");
}

function toggleDark(){
 document.body.classList.toggle("dark");
}
</script>

</body>
</html>
